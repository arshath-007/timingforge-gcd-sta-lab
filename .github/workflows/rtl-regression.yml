name: TimingForge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL self-check
        run: make rtl-test
      - name: Run Python regression
        run: make python-test
      - name: Run golden SDC lint
        run: make lint-sdc
      - name: Run static fault-injection benchmark
        run: make benchmark
      - name: Upload benchmark scorecard
        uses: actions/upload-artifact@v4
        with:
          name: timingforge-static-benchmark
          path: |
            build/benchmark_report.json
            build/benchmark_report.md

  library-backed-sta:
    runs-on: ubuntu-latest
    container:
      image: openroad/orfs:latest
    steps:
      - name: Checkout public repository source
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Load OpenROAD Flow Scripts environment and run Nangate45 matrix
        shell: bash
        run: |
          source /OpenROAD-flow-scripts/env.sh
          echo "Yosys: $(yosys -V)"
          echo "OpenROAD: $(openroad -version)"
          make sta-matrix
