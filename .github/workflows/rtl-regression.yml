name: TimingForge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL self-check
        run: make rtl-test
      - name: Run Python regression
        run: make python-test
      - name: Run golden SDC lint
        run: make lint-sdc
      - name: Run static fault-injection benchmark
        run: make benchmark
      - name: Upload benchmark scorecard
        uses: actions/upload-artifact@v4
        with:
          name: timingforge-static-benchmark
          path: |
            build/benchmark_report.json
            build/benchmark_report.md
