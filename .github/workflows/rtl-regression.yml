name: TimingForge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run RTL self-check
        run: make rtl-test
      - name: Verify RTL regression rejects a deliberately broken design
        shell: bash
        run: |
          mkdir -p build
          sed 's/x <= x - y;/x <= x - y + 1;/' rtl/gcd_binary_combined.sv > build/gcd_binary_combined_broken.sv
          iverilog -g2012 -s tb_gcd_compare -o build/tb_gcd_negative.vvp build/gcd_binary_combined_broken.sv rtl/gcd_binary_split.sv tb/tb_gcd_compare.sv
          if vvp build/tb_gcd_negative.vvp; then
            echo "ERROR: deliberately broken RTL unexpectedly passed the self-check"
            exit 1
          else
            echo "PASS: self-check rejected deliberately broken RTL"
          fi
      - name: Run FIFO and MAC extension block tests
        run: make ip-block-test
      - name: Run Python regression
        run: make python-test
      - name: Run golden SDC lint
        run: make lint-sdc
      - name: Run static fault-injection benchmark
        run: make benchmark
      - name: Record exact source revision
        if: always()
        shell: bash
        run: |
          {
            echo '## TimingForge regression evidence provenance'
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Checked-out SHA: $GITHUB_SHA"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha || 'not a pull_request event' }}"
            echo "- Ref: $GITHUB_REF"
            echo "- Event: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timingforge-static-benchmark
          path: |
            build/benchmark_report.json
            build/benchmark_report.md

  library-backed-sta:
    runs-on: ubuntu-24.04
    container:
      image: openroad/orfs@sha256:f05cee3219a02f26289f02f00e11a3fc986ab51a482a0000a2da810cda219a6e
    steps:
      - name: Checkout public repository source
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Load OpenROAD Flow Scripts environment and run Nangate45 matrix
        shell: bash
        run: |
          source /OpenROAD-flow-scripts/env.sh
          echo "Yosys: $(yosys -V)"
          echo "OpenROAD: $(openroad -version)"
          mkdir -p build
          { echo "Yosys: $(yosys -V)"; echo "OpenROAD: $(openroad -version)"; } | tee build/tool_versions.txt
          make sta-matrix
          python3 -m tools.qor_history snapshot build/reports/sta_matrix_summary.json --output build/reports/qor_snapshot.json
          python3 -m tools.qor_history compare benchmarks/qor_baseline.json build/reports/qor_snapshot.json --output build/reports/qor_comparison.json --area-tolerance-percent 0.5 --timing-tolerance-ns 0.005
          python3 -m tools.quality_checks build/reports/sta_matrix_summary.json --output build/reports/sta_quality_findings.json
          python3 -m tools.mutation_impact build/reports/sta_matrix_summary.json --output build/reports/sta_mutation_impact.json
          python3 -m tools.run_sensitivity
      - name: Record exact source revision for library-backed STA
        if: always()
        shell: bash
        run: |
          {
            echo '## TimingForge library-backed STA provenance'
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Checked-out SHA: $GITHUB_SHA"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha || 'not a pull_request event' }}"
            echo "- Ref: $GITHUB_REF"
            echo "- Event: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload library-backed STA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timingforge-nangate45-sta-matrix
          path: |
            build/reports/sta_matrix_summary.md
            build/reports/sta_matrix_summary.json
            build/reports/qor_snapshot.json
            build/reports/qor_comparison.json
            build/reports/sta_quality_findings.json
            build/reports/sta_mutation_impact.json
            build/sensitivity/**
            build/reports/sta_*.log
            build/yosys_*.log
            build/gcd_binary_*.v
            build/netlist_equiv/**
            build/tool_versions.txt
          retention-days: 90
