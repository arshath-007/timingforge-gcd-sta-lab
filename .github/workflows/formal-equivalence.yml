name: TimingForge formal equivalence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and CVC5
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys cvc5
          command -v yosys-smtbmc
          command -v cvc5
      - name: Run bounded GCD transaction-equivalence proof
        shell: bash
        run: bash scripts/run_formal.sh
      - name: Record exact source revision
        if: always()
        shell: bash
        run: |
          {
            echo '## TimingForge formal evidence provenance'
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Checked-out SHA: $GITHUB_SHA"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha || 'not a pull_request event' }}"
            echo "- Ref: $GITHUB_REF"
            echo "- Event: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload formal proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timingforge-formal-proof
          path: |
            build/formal/**
          retention-days: 90
