<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Static timing analysis critical path concepts</title><desc id="desc">A conceptual register-to-register path from launch clock through combinational logic to capture register, with startpoint, endpoint, data arrival, required time and slack definitions.</desc>
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#526078}.t{font-size:18px;font-weight:650}.s{font-size:14px;fill:#526078}.b{fill:#eaf2ff;stroke:#3973c6;stroke-width:2}.g{fill:#eaf8f0;stroke:#278653;stroke-width:2}.p{fill:#f3edff;stroke:#8055bd;stroke-width:2}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8055bd;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="510" fill="#fff"/><text x="55" y="58" class="h">TimingForge | Reading a register-to-register timing path</text><text x="55" y="88" class="sub">Conceptual STA illustration — not a measured TimingForge report or to-scale waveform</text>
<rect x="70" y="170" width="210" height="115" rx="14" class="b"/><text x="175" y="207" text-anchor="middle" class="t">Launch register</text><text x="175" y="238" text-anchor="middle" class="s">Startpoint</text><text x="175" y="260" text-anchor="middle" class="s">Clock launches data</text>
<rect x="410" y="170" width="300" height="115" rx="14" class="p"/><text x="560" y="207" text-anchor="middle" class="t">Combinational logic</text><text x="560" y="238" text-anchor="middle" class="s">Cell delay + net delay</text><text x="560" y="260" text-anchor="middle" class="s">Data propagates</text>
<rect x="840" y="170" width="250" height="115" rx="14" class="g"/><text x="965" y="207" text-anchor="middle" class="t">Capture register</text><text x="965" y="238" text-anchor="middle" class="s">Endpoint</text><text x="965" y="260" text-anchor="middle" class="s">Must meet setup check</text>
<path d="M280 227 H400 M710 227 H830" class="l"/>
<path d="M175 305 V345 H965 V305" class="dash"/><text x="570" y="371" text-anchor="middle" class="s">Clock relationship + uncertainty define the capture requirement</text>
<rect x="65" y="405" width="330" height="70" rx="12" class="b"/><text x="230" y="433" text-anchor="middle" class="t">Data arrival time</text><text x="230" y="456" text-anchor="middle" class="s">Launch + cell / net propagation</text>
<rect x="435" y="405" width="330" height="70" rx="12" class="g"/><text x="600" y="433" text-anchor="middle" class="t">Data required time</text><text x="600" y="456" text-anchor="middle" class="s">Capture edge adjusted for setup / uncertainty</text>
<rect x="805" y="405" width="330" height="70" rx="12" class="p"/><text x="970" y="433" text-anchor="middle" class="t">Setup slack</text><text x="970" y="456" text-anchor="middle" class="s">Required time − arrival time</text>
</svg>