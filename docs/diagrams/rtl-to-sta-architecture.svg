<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">TimingForge RTL-to-STA benchmark architecture</title><desc id="desc">Two GCD RTL architectures are verified and synthesized. Golden and mutated SDC constraints are checked and applied to mapped netlists in OpenSTA. Reports are parsed into a timing matrix and evidence.</desc>
