<rect x="365" y="145" width="235" height="130" rx="16" class="box green"/><text x="482" y="181" text-anchor="middle" class="t">RTL verification</text><text x="482" y="213" text-anchor="middle" class="s">Self-checking tests</text><text x="482" y="237" text-anchor="middle" class="s">Formal / protocol checks</text>
<rect x="365" y="335" width="235" height="130" rx="16" class="box blue"/><text x="482" y="371" text-anchor="middle" class="t">Yosys synthesis</text><text x="482" y="403" text-anchor="middle" class="s">Nangate45 library</text><text x="482" y="427" text-anchor="middle" class="s">Mapped netlists</text>
